    &lt;h2 style=&quot;margin:0 0 18px 0;font-family:&#x27;EB Garamond&#x27;,Garamond,Georgia,serif;font-weight:400;font-size:40px;line-height:42px;color:#FFEFAC;&quot;&gt;our house is your house.&lt;/h2&gt;

    &lt;p style=&quot;margin:0 0 26px 0;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:24px;color:#FFFCF7;&quot;&gt;Bring the people you&#x27;ll be seeing all December. No bookings needed, just turn up.&lt;/p&gt;
